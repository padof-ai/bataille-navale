<title>Puissance 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout : une table de jeu éclairée par une lampe, le support au centre, les scores au-dessus, les commandes dessous. */
:root{
  color-scheme:dark;
  --room:#0d1022;          /* pièce sombre */
  --lamp:#26305e;          /* halo de la lampe */
  --felt:#171c3a;          /* panneaux */
  --ink:#eef1ff;           /* texte */
  --muted:#9aa3cf;         /* texte secondaire */
  --red:#e3242b;
  --yellow:#f7c600;
  --blue:#2a6fe6;          /* bleu du support */
  --line:rgba(154,163,207,.22);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 70% 55% at 50% 42%,var(--lamp) 0,var(--room) 72%) fixed,var(--room);
  color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:680px;margin:0 auto;padding-block:10px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;align-items:center}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:.02em;line-height:1;
  color:var(--ink);text-shadow:0 3px 0 #0a2a6b,0 6px 14px rgba(0,0,0,.5)}
h1 b{font-weight:400;display:inline-grid;place-items:center;width:1.25em;height:1.25em;margin-left:.15em;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff3a0,var(--yellow) 45%,#b58600);color:#7a4c00;text-shadow:none;font-size:.85em;vertical-align:.05em;
  box-shadow:inset 0 0 0 .14em rgba(181,134,0,.55),0 4px 8px rgba(0,0,0,.45)}
button{font:inherit;font-weight:800;color:var(--ink);background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:hover{border-color:rgba(154,163,207,.5)}
button:focus-visible,.col:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#snd{padding:8px 12px;font-size:.85rem}

/* Scores */
.scorebar{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.pl{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:14px;background:var(--felt);border:2px solid transparent;transition:border-color .25s,box-shadow .25s;min-width:0}
.pl[data-p="2"]{flex-direction:row-reverse;text-align:right}
.pl.active[data-p="1"]{border-color:var(--red);box-shadow:0 0 18px rgba(227,36,43,.35)}
.pl.active[data-p="2"]{border-color:var(--yellow);box-shadow:0 0 18px rgba(247,198,0,.3)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.5)}
.dot.r{background:radial-gradient(circle at 38% 32%,#ff8a7a,var(--red) 45%,#8e0d14)}
.dot.y{background:radial-gradient(circle at 38% 32%,#fff3a0,var(--yellow) 45%,#b58600)}
.nm{font-weight:800;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sc{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
#status{font-weight:800;font-size:.9rem;color:var(--muted);text-align:center;min-width:6.5em}
#status.win{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.15rem;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:0}}

/* Support */
.stage{width:100%;display:flex;justify-content:center}
#bd{display:block;width:min(100%,620px,calc((100svh - 250px) * 780 / 790));max-width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.col{cursor:pointer;outline:none}
.ring{fill:none;stroke:#fff;stroke-width:7;animation:ring 1s ease-in-out infinite alternate}
@keyframes ring{from{stroke-opacity:.35}to{stroke-opacity:1}}

/* Commandes */
.controls{width:100%;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.seg{display:inline-flex;background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#newg{background:var(--yellow);border-color:var(--yellow);color:#3d2a00}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
@media (max-width:440px){.nm{font-size:.85rem}.sc{font-size:1.35rem}#status{font-size:.8rem;min-width:5em}.seg button{padding:8px 9px;font-size:.85rem}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}#status.win{animation:none}}
</style>

<div class="app">
  <div class="top">
    <h1>Puissance<b>4</b></h1>
    <button id="snd" aria-label="Activer ou couper le son"></button>
  </div>

  <div class="scorebar">
    <div class="pl" data-p="1"><span class="dot r"></span><span class="nm" id="n1">Rouge</span><span class="sc" id="s1">0</span></div>
    <div id="status" aria-live="polite">Au tour de Rouge</div>
    <div class="pl" data-p="2"><span class="dot y"></span><span class="nm" id="n2">Jaune</span><span class="sc" id="s2">0</span></div>
  </div>

  <div class="stage">
    <svg id="bd" viewBox="-40 -118 780 795" role="img" aria-label="Support de Puissance 4, 7 colonnes et 6 rangées">
      <defs>
        <radialGradient id="gR" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ff8f80"/><stop offset=".45" stop-color="#e3242b"/><stop offset="1" stop-color="#860b12"/></radialGradient>
        <radialGradient id="gY" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff5a8"/><stop offset=".45" stop-color="#f7c600"/><stop offset="1" stop-color="#a87b00"/></radialGradient>
        <linearGradient id="gBoard" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="#3f8bff"/><stop offset=".45" stop-color="#2160d8"/><stop offset="1" stop-color="#123c97"/></linearGradient>
        <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".3" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="gRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2766"/><stop offset=".5" stop-color="#1a4fb8"/><stop offset="1" stop-color="#7fb2ff"/></linearGradient>
        <linearGradient id="gFoot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#174aa8"/><stop offset=".5" stop-color="#2a6fe6"/><stop offset="1" stop-color="#0f3684"/></linearGradient>
        <g id="disc1">
          <circle r="40" fill="url(#gR)"/>
          <circle r="31" fill="none" stroke="#8e0d14" stroke-width="3.5" opacity=".75"/>
          <circle r="31" cx="-1.2" cy="-1.2" fill="none" stroke="#ffa497" stroke-width="1.6" opacity=".55"/>
          <circle r="22" fill="#d41d25" stroke="#9e1018" stroke-width="2.5"/>
          <circle r="13" fill="none" stroke="#9e1018" stroke-width="1.6" opacity=".55"/>
          <ellipse cx="-13" cy="-17" rx="13" ry="7" fill="#fff" opacity=".32" transform="rotate(-32 -13 -17)"/>
        </g>
        <g id="disc2">
          <circle r="40" fill="url(#gY)"/>
          <circle r="31" fill="none" stroke="#a87b00" stroke-width="3.5" opacity=".75"/>
          <circle r="31" cx="-1.2" cy="-1.2" fill="none" stroke="#fff8c2" stroke-width="1.6" opacity=".7"/>
          <circle r="22" fill="#eebd00" stroke="#b38400" stroke-width="2.5"/>
          <circle r="13" fill="none" stroke="#b38400" stroke-width="1.6" opacity=".55"/>
          <ellipse cx="-13" cy="-17" rx="13" ry="7" fill="#fff" opacity=".42" transform="rotate(-32 -13 -17)"/>
        </g>
      </defs>
      <ellipse cx="350" cy="668" rx="420" ry="16" fill="#000" opacity=".35"/>
      <g id="pieces"></g>
      <g id="front"></g>
      <g id="rings"></g>
      <use id="ghost" href="#disc1" x="350" y="-64" opacity=".95"/>
      <g id="cols"></g>
    </svg>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Mode de jeu">
      <button id="m-pvp" aria-pressed="true">2 joueurs</button>
      <button id="m-ai" aria-pressed="false">Contre l'ordinateur</button>
    </div>
    <div class="seg" id="lv" role="group" aria-label="Niveau" hidden>
      <button data-l="1" aria-pressed="false">Facile</button>
      <button data-l="2" aria-pressed="true">Moyen</button>
      <button data-l="3" aria-pressed="false">Difficile</button>
    </div>
  </div>
  <div class="controls">
    <button id="undo">↶ Annuler le coup</button>
    <button id="newg">Nouvelle partie</button>
  </div>
  <p class="hint">Touchez une colonne pour lâcher votre pion. Au clavier : flèches ← → puis Entrée.</p>
</div>

<script>
(() => {
const COLS = 7, ROWS = 6, NS = "http://www.w3.org/2000/svg";
const X = c => 50 + 100 * c, Y = r => 50 + 100 * r, GHOST_Y = -64;
const ORDER = [3, 2, 4, 1, 5, 0, 6];
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const load = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const save = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };

/* ---------- État ---------- */
let board, turn, moves, over, winCells, scores = {1:0, 2:0}, starter = 1;
let mode = "pvp", level = 2, hoverCol = 3, busy = false, thinking = false;
const pieceEls = {};   // "r,c" -> élément

/* ---------- Sons (Web Audio, aucun fichier) ---------- */
const Snd = {
  ctx: null, on: load("p4_sound") !== "0", nb: null,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = .9; this.out.connect(this.ctx.destination);
      const n = this.ctx.sampleRate, b = this.ctx.createBuffer(1, n, n), d = b.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
    }
    if(this.ctx.state === "suspended") this.ctx.resume();
  },
  ok(){ return this.on && this.ctx; },
  env(g, t, dur, peak){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur); },
  noise(dur, type, f, q, peak, delay = 0){
    if(!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    this.env(g, t, dur, peak); s.connect(fl).connect(g).connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  },
  tone(type, f0, f1, dur, peak, delay = 0){
    if(!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 30), t + dur);
    this.env(g, t, dur, peak); o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + .02);
  },
  /* Clac de plastique : intensité de 0 à 1 */
  clack(k = 1, delay = 0){
    const p = 1 + (Math.random() - .5) * .18;
    this.noise(.045, "bandpass", 3200 * p, 4, .55 * k, delay);
    this.tone("triangle", 1500 * p, 900 * p, .05, .22 * k, delay);
    this.tone("sine", 420 * p, 260, .07, .35 * k, delay);
  },
  slide(){ this.noise(.11, "bandpass", 1900, 1.5, .08); },
  tick(){ this.tone("sine", 1800, 1700, .025, .035); },
  bump(){ this.tone("square", 180, 120, .08, .07); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone("triangle", f, f, i === 3 ? .55 : .18, .2, .15 + i * .13)); },
  draw(){ [440, 349].forEach((f, i) => this.tone("triangle", f, f, .3, .15, .1 + i * .25)); },
  release(){
    this.noise(.25, "lowpass", 500, .7, .5);
    this.tone("square", 140, 70, .12, .08);
    for(let i = 0; i < 10; i++) this.clack(.35 + Math.random() * .4, .08 + i * .045 + Math.random() * .03);
  }
};
function sndLabel(){ $("snd").textContent = Snd.on ? "🔊 Son" : "🔇 Muet"; }
$("snd").onclick = () => { Snd.on = !Snd.on; save("p4_sound", Snd.on ? "1" : "0"); Snd.init(); sndLabel(); };
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => Snd.init(), {capture: true}));
sndLabel();

/* ---------- Dessin du support ---------- */
(function buildBoard(){
  let d = "M-15 13 Q-15 -15 13 -15 H687 Q715 -15 715 13 V587 Q715 615 687 615 H13 Q-15 615 -15 587 Z";
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    const x = X(c), y = Y(r), R = 41;
    d += ` M${x - R} ${y} a${R} ${R} 0 1 0 ${2 * R} 0 a${R} ${R} 0 1 0 ${-2 * R} 0 Z`;
  }
  const f = $("front");
  f.appendChild(svgEl("path", {d: "M-26 560 L-15 560 L-15 615 L36 615 L56 668 L-38 668 Z", fill: "url(#gFoot)", stroke: "#0b2766", "stroke-width": 3}));
  f.appendChild(svgEl("path", {d: "M726 560 L715 560 L715 615 L664 615 L644 668 L738 668 Z", fill: "url(#gFoot)", stroke: "#0b2766", "stroke-width": 3}));
  f.appendChild(svgEl("path", {d, fill: "url(#gBoard)", "fill-rule": "evenodd", stroke: "#0b2766", "stroke-width": 3}));
  f.appendChild(svgEl("path", {d, fill: "url(#gGloss)", "fill-rule": "evenodd"}));
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    f.appendChild(svgEl("circle", {cx: X(c), cy: Y(r), r: 43, fill: "none", stroke: "url(#gRim)", "stroke-width": 5}));
    f.appendChild(svgEl("circle", {cx: X(c), cy: Y(r), r: 39, fill: "none", stroke: "#000", "stroke-opacity": .28, "stroke-width": 4}));
  }
  f.appendChild(svgEl("rect", {x: -15, y: 600, width: 730, height: 15, rx: 4, fill: "#0f3684", opacity: .9}));
  const cols = $("cols");
  for(let c = 0; c < COLS; c++){
    const hit = svgEl("rect", {x: 100 * c, y: -118, width: 100, height: 795, fill: "transparent", class: "col", tabindex: c === 0 ? 0 : -1, "aria-label": "Colonne " + (c + 1), role: "button"});
    hit.addEventListener("pointerenter", () => setHover(c));
    hit.addEventListener("click", () => { setHover(c, true); humanPlay(c); });
    cols.appendChild(hit);
  }
})();

/* ---------- Animation (gravité + rebonds, sons calés sur les impacts) ---------- */
const anims = new Set();
let lastT = 0, rafOn = false;
function loop(t){
  const dt = Math.min(.033, (t - lastT) / 1000 || .016); lastT = t;
  for(const a of anims){
    a.vy += a.g * dt; a.y += a.vy * dt;
    if(a.target !== undefined && a.y >= a.target){
      a.y = a.target;
      const impact = Math.min(1, a.vy / 2600);
      if(impact > .08) Snd.clack(Math.max(.15, impact) * (a.bounces === 0 ? 1 : .6));
      a.vy = -a.vy * (reduced ? 0 : .3); a.bounces++;
      if(Math.abs(a.vy) < 320 || a.bounces > 3){ a.vy = 0; anims.delete(a); a.el.setAttribute("y", a.y); a.done && a.done(); continue; }
    }
    if(a.limit !== undefined && a.y > a.limit){ anims.delete(a); a.done && a.done(); continue; }
    a.el.setAttribute("y", a.y);
  }
  if(anims.size) requestAnimationFrame(loop); else rafOn = false;
}
function animate(a){ a.bounces = 0; anims.add(a); if(!rafOn){ rafOn = true; lastT = performance.now(); requestAnimationFrame(loop); } }

/* ---------- Règles ---------- */
const emptyBoard = () => Array.from({length: ROWS}, () => Array(COLS).fill(0));
function dropRow(b, c){ for(let r = ROWS - 1; r >= 0; r--) if(!b[r][c]) return r; return -1; }
function lineAt(b, r, c){
  const p = b[r][c]; if(!p) return null;
  for(const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const cells = [[r, c]];
    for(const s of [1, -1]){
      let rr = r + dr * s, cc = c + dc * s;
      while(rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr][cc] === p){ cells.push([rr, cc]); rr += dr * s; cc += dc * s; }
    }
    if(cells.length >= 4) return cells;
  }
  return null;
}
const isFull = b => b[0].every(v => v);

/* ---------- Ordinateur (minimax alpha-bêta) ---------- */
function evaluate(b, p){
  const o = 3 - p; let s = 0;
  for(let r = 0; r < ROWS; r++){ if(b[r][3] === p) s += 4; else if(b[r][3] === o) s -= 4; }
  const win = (cells) => {
    let mp = 0, mo = 0;
    for(const [r, c] of cells){ const v = b[r][c]; if(v === p) mp++; else if(v === o) mo++; }
    if(mp && mo) return 0;
    if(mp === 3) return 6; if(mp === 2) return 2;
    if(mo === 3) return -9; if(mo === 2) return -2;
    return 0;
  };
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    if(c + 3 < COLS) s += win([[r,c],[r,c+1],[r,c+2],[r,c+3]]);
    if(r + 3 < ROWS) s += win([[r,c],[r+1,c],[r+2,c],[r+3,c]]);
    if(r + 3 < ROWS && c + 3 < COLS) s += win([[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]]);
    if(r + 3 < ROWS && c - 3 >= 0) s += win([[r,c],[r+1,c-1],[r+2,c-2],[r+3,c-3]]);
  }
  return s;
}
function search(b, depth, alpha, beta, p){
  if(isFull(b)) return 0;
  if(depth === 0) return evaluate(b, p);
  let best = -Infinity;
  for(const c of ORDER){
    const r = dropRow(b, c); if(r < 0) continue;
    b[r][c] = p;
    const s = lineAt(b, r, c) ? 100000 + depth : -search(b, depth - 1, -beta, -alpha, 3 - p);
    b[r][c] = 0;
    if(s > best) best = s; if(best > alpha) alpha = best; if(alpha >= beta) break;
  }
  return best;
}
function aiChoice(){
  const b = board.map(r => r.slice()), p = turn;
  const legal = ORDER.filter(c => dropRow(b, c) >= 0);
  if(level === 1 && Math.random() < .4) return legal[Math.floor(Math.random() * legal.length)];
  const depth = level === 1 ? 2 : level === 2 ? 4 : 7;
  let best = -Infinity, choices = [];
  for(const c of legal){
    const r = dropRow(b, c); b[r][c] = p;
    const s = lineAt(b, r, c) ? 100000 + depth : -search(b, depth - 1, -Infinity, Infinity, 3 - p);
    b[r][c] = 0;
    if(s > best){ best = s; choices = [c]; } else if(s === best) choices.push(c);
  }
  return choices[Math.floor(Math.random() * Math.min(choices.length, level === 3 ? 1 : choices.length))];
}

/* ---------- Partie ---------- */
const names = () => mode === "ai" ? {1: "Vous", 2: "Ordi"} : {1: "Rouge", 2: "Jaune"};
const aiTurn = () => mode === "ai" && turn === 2 && !over;

function setHover(c, silent){
  if(c === hoverCol) return;
  hoverCol = c; if(!silent && !busy && !over && !aiTurn()) Snd.tick();
  updateGhost();
}
function updateGhost(){
  const g = $("ghost");
  g.setAttribute("x", X(hoverCol)); g.setAttribute("href", "#disc" + turn);
  g.style.visibility = (busy || over || aiTurn() || dropRow(board, hoverCol) < 0) ? "hidden" : "visible";
}
function updateUI(){
  const n = names();
  $("n1").textContent = n[1]; $("n2").textContent = n[2];
  $("s1").textContent = scores[1]; $("s2").textContent = scores[2];
  document.querySelectorAll(".pl").forEach(el => el.classList.toggle("active", !over && +el.dataset.p === turn));
  const st = $("status");
  if(over){
    st.className = "win";
    st.textContent = winCells ? (mode === "ai" ? (turn === 1 ? "Gagné !" : "Perdu…") : n[turn] + " gagne !") : "Match nul";
  } else {
    st.className = "";
    st.textContent = aiTurn() ? "L'ordinateur réfléchit…" : (mode === "ai" ? "À vous de jouer" : "Au tour de " + n[turn]);
  }
  $("undo").disabled = busy || thinking || over || moves.length === 0;
  updateGhost();
}
function addPiece(r, c, p, y){
  const el = svgEl("use", {href: "#disc" + p, x: X(c), y});
  $("pieces").appendChild(el); pieceEls[r + "," + c] = el; return el;
}
function humanPlay(c){
  if(busy || thinking || over || aiTurn()) return;
  play(c);
}
function play(c){
  const r = dropRow(board, c);
  if(r < 0){ Snd.bump(); return; }
  busy = true; board[r][c] = turn; moves.push([r, c]);
  const el = addPiece(r, c, turn, GHOST_Y);
  Snd.slide(); updateUI();
  animate({el, y: GHOST_Y, vy: 300, g: 7200, target: Y(r), done: () => afterMove(r, c)});
}
function afterMove(r, c){
  busy = false;
  const line = lineAt(board, r, c);
  if(line){
    over = true; winCells = line; scores[turn]++;
    line.forEach(([rr, cc]) => $("rings").appendChild(svgEl("circle", {cx: X(cc), cy: Y(rr), r: 36, class: "ring"})));
    Snd.win();
  } else if(isFull(board)){
    over = true; winCells = null; Snd.draw();
  } else turn = 3 - turn;
  updateUI(); snapshot();
  if(aiTurn()) scheduleAI();
}
function scheduleAI(){
  thinking = true; updateUI();
  setTimeout(() => {
    const c = aiChoice();
    thinking = false; setHover(c, true); play(c);
  }, 450 + Math.random() * 300);
}
function removeLast(){
  const [r, c] = moves.pop(); board[r][c] = 0;
  const el = pieceEls[r + "," + c]; delete pieceEls[r + "," + c];
  if(el) el.remove();
}
$("undo").onclick = () => {
  if(busy || thinking || over || !moves.length) return;
  removeLast(); turn = 3 - turn;
  if(mode === "ai" && turn === 2 && moves.length){ removeLast(); turn = 1; }
  if(aiTurn()){ updateUI(); scheduleAI(); return; }
  updateUI(); snapshot();
};
function reset(){
  board = emptyBoard(); moves = []; over = false; winCells = null; turn = starter;
  $("pieces").innerHTML = ""; $("rings").innerHTML = "";
  for(const k in pieceEls) delete pieceEls[k];
  updateUI(); snapshot();
  if(aiTurn()) scheduleAI();
}
function newGame(){
  if(busy || thinking) return;
  starter = 3 - starter;
  const els = Object.values(pieceEls);
  if(!els.length){ reset(); return; }
  busy = true; $("rings").innerHTML = ""; updateUI(); $("ghost").style.visibility = "hidden";
  Snd.release();
  let left = els.length;
  els.forEach(el => {
    const y = +el.getAttribute("y");
    setTimeout(() => animate({el, y, vy: 0, g: 5200 + Math.random() * 1500, limit: 820, done: () => { if(--left === 0){ busy = false; reset(); } }}), Math.random() * 90);
  });
}
$("newg").onclick = newGame;

function setMode(m){
  if(busy || thinking || m === mode) return;
  mode = m;
  $("m-pvp").setAttribute("aria-pressed", m === "pvp"); $("m-ai").setAttribute("aria-pressed", m === "ai");
  $("lv").hidden = m !== "ai";
  scores = {1: 0, 2: 0}; starter = 2;
  newGame();
}
$("m-pvp").onclick = () => setMode("pvp");
$("m-ai").onclick = () => setMode("ai");
document.querySelectorAll("#lv button").forEach(b => b.onclick = () => {
  level = +b.dataset.l;
  document.querySelectorAll("#lv button").forEach(x => x.setAttribute("aria-pressed", x === b));
  snapshot();
});

document.addEventListener("keydown", e => {
  if(e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
  if(e.key === "ArrowLeft"){ setHover(Math.max(0, hoverCol - 1)); e.preventDefault(); }
  else if(e.key === "ArrowRight"){ setHover(Math.min(COLS - 1, hoverCol + 1)); e.preventDefault(); }
  else if(e.key === "Enter" || e.key === " " || e.key === "ArrowDown"){ humanPlay(hoverCol); e.preventDefault(); }
});

/* ---------- Conserver la partie lors d'une mise à jour de la page ---------- */
function snapshot(){
  try{ window.claude?.hot?.snapshot?.(() => ({board, turn, moves, scores, starter, mode, level, over, winCells})); }catch(e){}
}
function start(data){
  if(data && data.board){
    ({board, turn, moves, scores, starter, mode, level, over, winCells} = data);
    for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) if(board[r][c]) addPiece(r, c, board[r][c], Y(r));
    (winCells || []).forEach(([rr, cc]) => $("rings").appendChild(svgEl("circle", {cx: X(cc), cy: Y(rr), r: 36, class: "ring"})));
    $("m-pvp").setAttribute("aria-pressed", mode === "pvp"); $("m-ai").setAttribute("aria-pressed", mode === "ai");
    $("lv").hidden = mode !== "ai";
    document.querySelectorAll("#lv button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.l === level));
    updateUI(); snapshot();
    if(aiTurn()) scheduleAI();
  } else reset();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
