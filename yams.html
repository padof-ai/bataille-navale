<title>Yam's du café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout : la piste à dés en feutrine et le gobelet à gauche, la feuille de marque à droite (empilées sur téléphone). */
:root{
  color-scheme:dark;
  --bar:#1a120c;           /* comptoir sombre */
  --wood:#7a4a26;          /* bordure de la piste */
  --felt:#1e6b45;          /* feutrine */
  --ivory:#fbf6e9;         /* dés */
  --pip:#1b1b22;
  --paper:#fbf8ef;         /* feuille de marque */
  --pencil:#3b3b44;
  --gold:#f2c14e;
  --ink:#f5ede0; --muted:#c7b9a3;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --ui:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse 75% 55% at 40% 30%,#3a2616 0,var(--bar) 70%) fixed,var(--bar)}
.app{max-width:1040px;margin:0 auto;padding-block:12px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 24px;align-items:start}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1;color:var(--gold);text-shadow:0 3px 0 #5a3410,0 6px 14px rgba(0,0,0,.5)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:800;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(245,237,224,.2);border-radius:11px;padding:9px 13px;cursor:pointer}
button:hover:not(:disabled){border-color:rgba(245,237,224,.45)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid rgba(245,237,224,.18);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--felt);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}

/* Piste */
.play{display:flex;flex-direction:column;gap:12px;min-width:0}
.status{font-weight:800;font-size:1.05rem;min-height:1.4em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status .who{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--gold)}
.tray{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:22px;padding:14px;
  background:linear-gradient(145deg,#a0663a,var(--wood) 40%,#4e2c14);box-shadow:0 16px 34px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.18)}
.felt{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;
  background:
    radial-gradient(ellipse at 45% 40%,rgba(255,255,255,.1),transparent 60%),
    repeating-radial-gradient(circle at 30% 30%,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
    var(--felt);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.25)}
.felt .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  font-family:var(--hand);font-size:clamp(1.4rem,5vw,2rem);color:rgba(255,255,255,.35);pointer-events:none}
.die{position:absolute;width:15%;aspect-ratio:1;border-radius:19%;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,#fff,var(--ivory) 55%,#e5dcc4);
  box-shadow:inset -3px -4px 6px rgba(0,0,0,.18),inset 2px 2px 3px rgba(255,255,255,.9),0 7px 10px rgba(0,0,0,.45);
  padding:0;transform-origin:50% 50%;border:0}
.die .pf{position:absolute;inset:14%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6%}
.die i{border-radius:50%;margin:6%}
.die i.on{background:radial-gradient(circle at 40% 35%,#4a4a55,var(--pip) 60%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7)}
.die.red i.on.c{background:radial-gradient(circle at 40% 35%,#ff6b6b,#b3121b 60%)}
.die:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.die.flash{animation:fl .9s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(242,193,78,.9),0 7px 10px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 18px rgba(242,193,78,0),0 7px 10px rgba(0,0,0,.45)}}
.kept{display:flex;align-items:center;gap:10px;min-height:66px;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px dashed rgba(245,237,224,.25)}
.kept .lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none;width:4.8em;line-height:1.2}
.kept .row{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.kept .die{position:relative;width:50px;flex:none;animation:keepin .22s ease-out}
@keyframes keepin{from{transform:translateY(-14px) scale(1.1);opacity:.4}}
.go{display:flex;align-items:center;gap:14px}
.cup{position:relative;flex:none;width:92px;height:96px;cursor:pointer;border:0;padding:0;background:transparent}
.cup .body{position:absolute;inset:10px 6px 0;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);border-radius:6px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px),linear-gradient(90deg,#5a2e12,#9a5a2a 35%,#6d3816 70%,#3e1e0a)}
.cup .rim{position:absolute;left:4px;right:4px;top:4px;height:16px;border-radius:50%;background:linear-gradient(#2a1406,#5a2e12);box-shadow:0 2px 0 #b97a44}
.cup .stitch{position:absolute;left:16%;right:16%;top:36%;border-top:2px dashed #e2b47c;opacity:.7}
.cup.shake{animation:shake .55s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) translateY(-6px)}35%{transform:rotate(12deg) translateY(-10px)}55%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(10deg) translateY(-8px)}}
.cup:disabled{opacity:.45;cursor:default}
.cup:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
#rollbtn{flex:1;background:var(--gold);border-color:var(--gold);color:#3a2400;padding:14px;font-size:1.05rem}
.rolls{display:flex;gap:6px;margin-top:6px}
.rolls i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.12)}
.rolls i.on{background:var(--gold)}
.stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.stamp span{font-family:var(--display);font-size:clamp(2.6rem,11vw,4.6rem);color:var(--gold);transform:rotate(-10deg);text-shadow:0 4px 0 #6b3d0a,0 0 30px rgba(242,193,78,.6);animation:stamp .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{transform:rotate(-10deg) scale(3);opacity:0}25%{opacity:1}70%{transform:rotate(-10deg) scale(1)}100%{transform:rotate(-10deg) scale(1);opacity:0}}

/* Feuille de marque */
.sheet{background:var(--paper);color:var(--pencil);border-radius:6px;padding:14px 12px 10px;box-shadow:0 16px 34px rgba(0,0,0,.5);min-width:0;
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(70,110,170,.12) 33px 34px);background-color:var(--paper)}
.sheet h2{margin:0 4px 8px;font-family:var(--display);font-weight:400;font-size:1.25rem;color:#8a2a1a;letter-spacing:.02em}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:0 6px;height:34px;border-bottom:1px solid rgba(59,59,68,.14);text-align:left}
th{font-weight:800}
thead th{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:#6b6b75;height:30px}
thead th.pc{text-align:center}
thead th.cur{color:#8a2a1a}
td.sc{text-align:center;font-family:var(--hand);font-size:1.45rem;font-weight:700;color:#1f3fa6;min-width:52px;font-variant-numeric:tabular-nums}
td.sc.cur{background:rgba(242,193,78,.18)}
td.sc button{width:100%;height:30px;padding:0;border:1px dashed rgba(59,59,68,.35);border-radius:8px;background:rgba(255,255,255,.6);
  font-family:var(--hand);font-size:1.35rem;font-weight:700;color:#9a9aa4}
td.sc button.good{color:#1e6b45;border-color:rgba(30,107,69,.5)}
td.sc button:hover{background:#fff;color:#1f3fa6;border-style:solid}
td.sc .zero{color:#9a9aa4}
td.sc.new{animation:ink .6s ease-out}
@keyframes ink{from{opacity:0;transform:scale(1.5)}}
.lab small{display:block;font-weight:600;font-size:.7rem;color:#8a8a94;line-height:1.1}
tr.sum th,tr.sum td{border-bottom:2px solid rgba(59,59,68,.35);background:rgba(59,59,68,.05)}
tr.total th,tr.total td{border-top:2px solid #8a2a1a;border-bottom:0;font-size:1rem}
tr.total td.sc{font-size:1.7rem;color:#8a2a1a}
.bonusinfo{font-size:.72rem;color:#8a8a94;display:block;font-weight:600}

/* Fin de partie */
.end{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,6,3,.75);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.end .card{background:var(--paper);color:var(--pencil);border-radius:14px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.end h3{margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:1.8rem;color:#8a2a1a}
.end ol{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px}
.end li{display:flex;justify-content:space-between;font-weight:800;padding:8px 12px;border-radius:10px;background:rgba(59,59,68,.06)}
.end li:first-child{background:rgba(242,193,78,.35)}
.end li b{font-family:var(--hand);font-size:1.5rem;color:#1f3fa6}
.end button{background:var(--felt);color:#fff;border:0;padding:12px 20px}

@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.cup{width:76px;height:80px}}
@media (prefers-reduced-motion:reduce){.cup.shake,.stamp span,td.sc.new,.kept .die{animation:none}}
</style>

<div class="app">
  <div class="top">
    <h1>Yam's</h1>
    <div class="tools">
      <div class="seg" role="group" aria-label="Joueurs">
        <button data-m="solo" aria-pressed="false">Solo</button>
        <button data-m="duo" aria-pressed="false">2 joueurs</button>
        <button data-m="ai" aria-pressed="true">Contre l'ordi</button>
      </div>
      <button id="snd" aria-label="Activer ou couper le son"></button>
      <button id="newg">Nouvelle partie</button>
    </div>
  </div>

  <section class="play">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="tray">
      <div class="felt" id="felt"><div class="hint" id="hint">Secouez le gobelet pour lancer les dés</div></div>
      <div class="stamp" id="stamp" hidden><span id="stamptxt">Yam's !</span></div>
    </div>
    <div class="kept"><span class="lbl">Dés gardés</span><div class="row" id="kept"></div></div>
    <div class="go">
      <button class="cup" id="cup" aria-label="Secouer le gobelet et lancer"><span class="body"></span><span class="rim"></span><span class="stitch"></span></button>
      <div style="flex:1;min-width:0">
        <button id="rollbtn" style="width:100%">Lancer les dés</button>
        <div class="rolls" id="rolls" aria-label="Lancers restants"></div>
      </div>
    </div>
  </section>

  <section class="sheet">
    <h2>Feuille de marque</h2>
    <div class="tbl"><table id="tbl"></table></div>
  </section>
</div>

<div class="end" id="end" hidden>
  <div class="card">
    <h3 id="endt">Partie terminée</h3>
    <ol id="rank"></ol>
    <button id="again">Rejouer</button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const load = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const save = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const rnd = n => Math.floor(Math.random() * n);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= SONS ================= */
const Snd = {
  ctx: null, on: load("ym_sound") !== "0", nb: null,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = .9; this.out.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
    }
    if(this.ctx.state === "suspended") this.ctx.resume();
  },
  ok(){ return this.on && this.ctx; },
  hit(f, q, peak, dur, delay = 0, type = "bandpass"){
    if(!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(this.out); s.start(t, Math.random()); s.stop(t + dur + .02);
  },
  tone(f0, f1, dur, peak, delay = 0, type = "sine"){
    if(!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + .02);
  },
  /* dés qui s'entrechoquent dans le gobelet de cuir */
  shake(ms, n){
    const k = Math.max(1, n);
    for(let i = 0; i < 14 + k * 4; i++){
      const d = Math.random() * ms / 1000;
      this.hit(1800 + Math.random() * 2200, 6, .16 + Math.random() * .12, .03, d);
      if(i % 3 === 0) this.hit(400, 1, .1, .06, d, "lowpass");
    }
  },
  /* un dé touche la feutrine, parfois un autre dé */
  bounce(k = 1, delay = 0){
    this.hit(260 + Math.random() * 120, 1, .45 * k, .07, delay, "lowpass");
    if(Math.random() < .65) this.hit(2600 + Math.random() * 1600, 7, .22 * k, .025, delay + .01 + Math.random() * .03);
  },
  keep(){ this.hit(1300, 3, .25, .03); this.tone(700, 500, .05, .08, 0, "triangle"); },
  pencil(){
    if(!this.ok()) return;
    for(let i = 0; i < 3; i++) this.hit(3600 + Math.random() * 800, 1, .12, .09, i * .1, "bandpass");
    this.hit(600, 1, .05, .3, 0, "lowpass");
  },
  note(f, delay, dur = .45, peak = .15){ this.tone(f, f, dur, peak, delay, "triangle"); this.tone(f * 2, f * 2, dur * .5, peak * .25, delay); },
  bonus(){ [784, 988, 1175].forEach((f, i) => this.note(f, i * .1)); },
  yams(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.note(f, i * .11, i === 6 ? .9 : .3, .17)); },
  zero(){ this.tone(220, 150, .25, .1, 0, "sawtooth"); },
  end(){ [392, 523, 659, 784, 1047].forEach((f, i) => this.note(f, i * .16, i === 4 ? 1 : .35, .17)); }
};
function sndLabel(){ $("snd").textContent = Snd.on ? "🔊 Son" : "🔇 Muet"; }
$("snd").onclick = () => { Snd.on = !Snd.on; save("ym_sound", Snd.on ? "1" : "0"); Snd.init(); sndLabel(); };
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => Snd.init(), {capture: true}));
sndLabel();

/* ================= RÈGLES ================= */
const CATS = [
  {id: "1", label: "As", up: 1}, {id: "2", label: "Deux", up: 2}, {id: "3", label: "Trois", up: 3},
  {id: "4", label: "Quatre", up: 4}, {id: "5", label: "Cinq", up: 5}, {id: "6", label: "Six", up: 6},
  {id: "brelan", label: "Brelan", hint: "3 identiques · total des dés"},
  {id: "carre", label: "Carré", hint: "4 identiques · total des dés"},
  {id: "full", label: "Full", hint: "3 + 2 identiques · 25"},
  {id: "petite", label: "Petite suite", hint: "4 qui se suivent · 30"},
  {id: "grande", label: "Grande suite", hint: "5 qui se suivent · 40"},
  {id: "yams", label: "Yam's", hint: "5 identiques · 50"},
  {id: "chance", label: "Chance", hint: "total des dés"}
];
const BASE = {"1": 2.1, "2": 5.3, "3": 8.6, "4": 12.2, "5": 15.7, "6": 19.2, brelan: 21, carre: 12, full: 22, petite: 27, grande: 30, yams: 14, chance: 22};
function scoreOf(id, d){
  const cnt = [0, 0, 0, 0, 0, 0, 0]; d.forEach(v => cnt[v]++);
  const sum = d.reduce((a, b) => a + b, 0), mx = Math.max(...cnt);
  const has = s => s.every(v => cnt[v] > 0);
  switch(id){
    case "brelan": return mx >= 3 ? sum : 0;
    case "carre": return mx >= 4 ? sum : 0;
    case "full": { const c = cnt.filter(x => x).sort(); return c.length === 2 && c[0] === 2 && c[1] === 3 ? 25 : 0; }
    case "petite": return has([1,2,3,4]) || has([2,3,4,5]) || has([3,4,5,6]) ? 30 : 0;
    case "grande": return has([1,2,3,4,5]) || has([2,3,4,5,6]) ? 40 : 0;
    case "yams": return mx === 5 ? 50 : 0;
    case "chance": return sum;
    default: return cnt[+id] * +id;
  }
}
const upperSum = p => CATS.slice(0, 6).reduce((a, c) => a + (p.s[c.id] || 0), 0);
const bonusOf = p => upperSum(p) >= 63 ? 35 : 0;
const totalOf = p => CATS.reduce((a, c) => a + (p.s[c.id] || 0), 0) + bonusOf(p);

/* ================= ÉTAT ================= */
let mode = "ai";
let G = null;
let busy = false;
let netGen = 0;
const NET = () => mode === "net";
function newState(){
  if(NET()) return {players: Net.names.map((n, i) => ({name: i === Net.me ? "Vous" : n, ai: i !== Net.me, s: {}})),
          cur: 0, dice: [1, 2, 3, 4, 5], held: [false, false, false, false, false], left: 3, rolled: false, last: null};
  const names = mode === "solo" ? ["Vous"] : mode === "duo" ? ["Joueur 1", "Joueur 2"] : ["Vous", "Ordinateur"];
  return {players: names.map((n, i) => ({name: n, ai: mode === "ai" && i === 1, s: {}})),
          cur: 0, dice: [1, 2, 3, 4, 5], held: [false, false, false, false, false], left: 3, rolled: false, last: null};
}
const P = () => G.players[G.cur];

/* ================= DÉS ================= */
const PIPS = {1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]};
function faceHTML(v){ let h = '<span class="pf">'; for(let i = 0; i < 9; i++) h += `<i class="${PIPS[v].includes(i) ? "on" + (v === 1 && i === 4 ? " c" : "") : ""}"></i>`; return h + "</span>"; }
const dieEls = [];
const spots = [];   // position de chaque dé sur la feutrine {x,y,r} en %
function makeDie(i){
  const b = document.createElement("button");
  b.className = "die red"; b.type = "button";
  b.addEventListener("click", () => toggleHold(i));
  return b;
}
for(let i = 0; i < 5; i++){ dieEls.push(makeDie(i)); spots.push({x: 10 + i * 17, y: 40, r: 0}); }
function scatter(idx){
  const taken = spots.filter((_, i) => !idx.includes(i) && !G.held[i]);
  idx.forEach(i => {
    let s, tries = 0;
    do{ s = {x: 4 + Math.random() * 78, y: 6 + Math.random() * 62, r: rnd(70) - 35}; tries++; }
    while(tries < 200 && taken.some(t => Math.hypot((t.x - s.x) * 1.6, t.y - s.y) < 30));
    spots[i] = s; taken.push(s);
  });
}
function renderDice(){
  const felt = $("felt"), kept = $("kept");
  $("hint").hidden = G.rolled;
  dieEls.forEach((el, i) => {
    el.innerHTML = faceHTML(G.dice[i]);
    el.setAttribute("aria-label", "Dé " + G.dice[i] + (G.held[i] ? ", gardé — touchez pour le relancer" : " — touchez pour le garder"));
    const canTouch = G.rolled && G.left > 0 && !P().ai && !busy;
    el.disabled = !canTouch;
    el.style.cursor = canTouch ? "pointer" : "default";
    if(!G.rolled){ if(el.parentNode) el.remove(); return; }
    if(G.held[i]){
      if(el.parentNode !== kept){ el.style.left = el.style.top = ""; el.style.transform = ""; kept.appendChild(el); }
    } else {
      if(el.parentNode !== felt){ felt.appendChild(el); }
      el.style.left = spots[i].x + "%"; el.style.top = spots[i].y + "%"; el.style.transform = `rotate(${spots[i].r}deg)`;
    }
  });
  // garder l'ordre des dés gardés
  dieEls.forEach((el, i) => { if(G.held[i]) kept.appendChild(el); });
}
function toggleHold(i){
  if(busy || !G.rolled || G.left === 0 || P().ai) return;
  G.held[i] = !G.held[i];
  if(!G.held[i]) scatter([i]);
  Snd.keep(); renderDice(); renderUI(); snapshot();
}
async function roll(){
  if(busy || G.left === 0 || (G.rolled && G.held.every(h => h))) return;
  busy = true;
  const idx = [0, 1, 2, 3, 4].filter(i => !G.held[i] || !G.rolled);
  if(!G.rolled) G.held = [false, false, false, false, false];
  renderUI();
  const cup = $("cup");
  cup.classList.remove("shake"); void cup.offsetWidth; cup.classList.add("shake");
  Snd.shake(520, idx.length);
  await sleep(reduced ? 80 : 540);
  cup.classList.remove("shake");
  idx.forEach(i => { G.dice[i] = 1 + Math.floor((NET() ? Net.rand() : Math.random()) * 6); });
  G.left--; G.rolled = true;
  scatter(idx); renderDice();
  const felt = $("felt");
  const anims = idx.map((i, k) => {
    const el = dieEls[i], s = spots[i];
    if(reduced) return Promise.resolve();
    const dx = 95 - s.x, dy = 55 - s.y, spin = (Math.random() < .5 ? -1 : 1) * (360 + rnd(360));
    const W = felt.clientWidth, H = felt.clientHeight;
    const px = dx * W / 100, py = dy * H / 100;
    const dur = 760 + k * 60 + rnd(120);
    // changement de face pendant la course
    let t = 0; const iv = setInterval(() => { el.innerHTML = faceHTML(1 + rnd(6)); if((t += 70) > dur - 120){ clearInterval(iv); el.innerHTML = faceHTML(G.dice[i]); } }, 70);
    [.28, .55, .78, .93].forEach((f, j) => Snd.bounce([1, .6, .35, .2][j], f * dur / 1000 + k * .02));
    return el.animate([
      {transform: `translate(${px}px,${py * .3}px) rotate(${s.r + spin}deg) scale(1.15)`, offset: 0},
      {transform: `translate(${px * .55}px,${py * .55 - 30}px) rotate(${s.r + spin * .6}deg) scale(1.08)`, offset: .28},
      {transform: `translate(${px * .25}px,${py * .2}px) rotate(${s.r + spin * .3}deg) scale(1.03)`, offset: .55},
      {transform: `translate(${px * .07}px,${py * .05 - 6}px) rotate(${s.r + spin * .08}deg)`, offset: .78},
      {transform: `translate(0,0) rotate(${s.r}deg)`, offset: 1}
    ], {duration: dur, easing: "cubic-bezier(.25,.6,.4,1)"}).finished.catch(() => {});
  });
  await Promise.all(anims);
  busy = false;
  const d = G.dice;
  if(d.every(v => v === d[0])){ stamp("Yam's !"); Snd.yams(); dieEls.forEach(e => { e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); }); }
  renderDice(); renderUI(); snapshot();
  if(NET()) netStep();
}
function stamp(t){
  $("stamptxt").textContent = t; const s = $("stamp"); s.hidden = false;
  const sp = $("stamptxt"); sp.style.animation = "none"; void sp.offsetWidth; sp.style.animation = "";
  setTimeout(() => { s.hidden = true; }, 1000);
}
function myRoll(){
  if(P().ai || busy || G.left === 0 || (G.rolled && G.held.every(h => h))) return;
  if(NET()) Net.send({r: G.rolled ? G.held.slice() : [false, false, false, false, false]});
  roll();
}
$("rollbtn").onclick = myRoll;
$("cup").onclick = myRoll;

/* ================= FEUILLE ================= */
function renderSheet(){
  const ps = G.players, t = $("tbl");
  let h = `<thead><tr><th></th>${ps.map((p, i) => `<th class="pc${i === G.cur ? " cur" : ""}">${p.name}</th>`).join("")}</tr></thead><tbody>`;
  const cell = (p, i, c) => {
    const v = p.s[c.id];
    const isCur = i === G.cur;
    if(v !== undefined) return `<td class="sc${isCur ? " cur" : ""}${G.last && G.last.p === i && G.last.c === c.id ? " new" : ""}">${v === 0 ? '<span class="zero">—</span>' : v}</td>`;
    if(isCur && G.rolled && !p.ai && !busy){
      const s = scoreOf(c.id, G.dice);
      return `<td class="sc cur"><button data-c="${c.id}" class="${s > 0 ? "good" : ""}" aria-label="Inscrire ${s} en ${c.label}">${s}</button></td>`;
    }
    return `<td class="sc${isCur ? " cur" : ""}"></td>`;
  };
  CATS.forEach((c, k) => {
    if(k === 6){
      h += `<tr class="sum"><th>Total haut<span class="bonusinfo">bonus 35 à partir de 63</span></th>${ps.map((p, i) => `<td class="sc${i === G.cur ? " cur" : ""}">${upperSum(p)}</td>`).join("")}</tr>`;
      h += `<tr class="sum"><th>Bonus</th>${ps.map((p, i) => { const u = upperSum(p), b = bonusOf(p); return `<td class="sc${i === G.cur ? " cur" : ""}">${b ? b : `<span class="zero" style="font-size:1rem">${u >= 63 ? "" : "reste " + (63 - u)}</span>`}</td>`; }).join("")}</tr>`;
    }
    h += `<tr><th class="lab">${c.label}${c.hint ? `<small>${c.hint}</small>` : ""}</th>${ps.map((p, i) => cell(p, i, c)).join("")}</tr>`;
  });
  h += `<tr class="total"><th>Total</th>${ps.map((p, i) => `<td class="sc${i === G.cur ? " cur" : ""}">${totalOf(p)}</td>`).join("")}</tr></tbody>`;
  t.innerHTML = h;
  t.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => { if(busy || P().ai) return; if(NET()) Net.send({c: b.dataset.c}); choose(b.dataset.c); });
}
function choose(id){
  if(busy || !G.rolled || P().s[id] !== undefined) return;
  const before = bonusOf(P()), v = scoreOf(id, G.dice);
  P().s[id] = v; G.last = {p: G.cur, c: id};
  Snd.pencil(); if(v === 0) Snd.zero();
  if(!before && bonusOf(P())){ setTimeout(() => { Snd.bonus(); stamp("Bonus +35"); }, 300); }
  nextTurn();
}
function nextTurn(){
  G.cur = (G.cur + 1) % G.players.length;
  G.held = [false, false, false, false, false]; G.left = 3; G.rolled = false;
  renderDice(); renderUI(); snapshot();
  if(G.players.every(p => CATS.every(c => p.s[c.id] !== undefined))){ setTimeout(finish, 700); if(NET()) netStep(); return; }
  if(NET()){ netStep(); return; }
  if(P().ai){ const g = G; setTimeout(() => { if(G === g) aiTurn(); }, 700); }
}
function finish(){
  const rk = G.players.map(p => ({n: p.name, t: totalOf(p)})).sort((a, b) => b.t - a.t);
  $("endt").textContent = G.players.length === 1 ? "Votre score : " + rk[0].t : (rk[0].t === rk[1].t ? "Égalité !" : rk[0].n === "Vous" ? "Vous avez gagné !" : rk[0].n + " a gagné !");
  $("rank").innerHTML = rk.map(r => `<li><span>${r.n}</span><b>${r.t}</b></li>`).join("");
  if(G.players.length === 1){
    let best = 0; try{ best = +(load("ym_best") || 0); }catch(e){}
    if(rk[0].t > best){ save("ym_best", rk[0].t); $("rank").innerHTML += `<li><span>Nouveau record !</span><b>★</b></li>`; }
    else if(best) $("rank").innerHTML += `<li><span>Record</span><b>${best}</b></li>`;
  }
  $("end").hidden = false; Snd.end();
}
$("again").onclick = () => { if(NET()){ Net.send({t: "new"}, null, true); return; } $("end").hidden = true; start({}); };

/* ================= EN LIGNE ================= */
function netAI(){
  const p = P();
  if(!G.rolled) return {r: [false, false, false, false, false]};
  if(G.left > 0){ const h = bestHold(G.dice, p, G.left); if(!h.keep.every(k => k)) return {r: h.keep.map(Boolean)}; }
  return {c: bestCat(G.dice, p).id};
}
function netStep(){
  const my = netGen, g = G, ok = () => my === netGen && NET() && G === g;
  if(G.players.every(p => CATS.every(c => p.s[c.id] !== undefined))){
    Net.next().then(a => { if(my === netGen && NET() && a && a.t === "new"){ $("end").hidden = true; start({}); } });
    return;
  }
  const apply = async a => {
    if(!ok()) return;
    if(a.c){ await sleep(400); if(ok()) choose(a.c); return; }
    if(a.r){
      if(G.rolled){
        for(let i = 0; i < 5; i++){ const w = !!a.r[i]; if(G.held[i] !== w){ G.held[i] = w; if(!w) scatter([i]); Snd.keep(); renderDice(); await sleep(200); if(!ok()) return; } }
        await sleep(250); if(!ok()) return;
      }
      roll();
    }
  };
  if(G.cur === Net.me) Net.mine(apply);
  else Net.turn(G.cur, netAI).then(apply);
}

/* ================= STATUT ================= */
function renderUI(){
  const p = P(), st = $("status");
  const who = G.players.length > 1 ? `<span class="who">${p.name}</span>` : "";
  let msg;
  if(p.ai) msg = busy ? "lance les dés…" : "réfléchit…";
  else if(!G.rolled) msg = "secouez le gobelet pour votre premier lancer.";
  else if(G.left > 0) msg = "touchez les dés à garder, relancez, ou inscrivez vos points.";
  else msg = "plus de lancer : choisissez une case sur la feuille.";
  st.innerHTML = who + (who ? msg : msg.charAt(0).toUpperCase() + msg.slice(1));
  const canRoll = !busy && !p.ai && G.left > 0 && !(G.rolled && G.held.every(h => h));
  $("rollbtn").disabled = !canRoll; $("cup").disabled = !canRoll;
  $("rollbtn").textContent = !G.rolled ? "Lancer les dés" : G.left > 0 ? `Relancer (${G.left} restant${G.left > 1 ? "s" : ""})` : "Plus de lancer";
  const r = $("rolls"); r.innerHTML = "";
  for(let i = 0; i < 3; i++){ const d = document.createElement("i"); if(i < G.left) d.className = "on"; r.appendChild(d); }
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode));
  document.querySelector(".seg").hidden = NET(); $("newg").hidden = NET();
  if(window.Net) Net.refresh();
  renderSheet();
}

/* ================= ORDINATEUR ================= */
function utility(id, d, p){
  let s = scoreOf(id, d), u = s - BASE[id];
  const CAT = CATS.find(c => c.id === id);
  if(CAT.up){
    const need = Math.max(0, 63 - upperSum(p));
    if(need > 0) u += (s - 3 * CAT.up) * .9 + (s >= need ? 12 : 0);
  }
  if(id === "chance" && s < 22) u -= 4;
  if(s === 0 && (id === "yams" || id === "grande")) u += 6;
  return u;
}
function bestCat(d, p){
  let best = null;
  for(const c of CATS){ if(p.s[c.id] !== undefined) continue; const u = utility(c.id, d, p); if(!best || u > best.u) best = {id: c.id, u}; }
  return best;
}
function bestHold(d, p, left){
  let best = null;
  for(let m = 0; m < 32; m++){
    const keep = [0, 1, 2, 3, 4].map(i => (m >> i) & 1);
    let tot = 0; const N = m === 31 ? 1 : 70;
    for(let k = 0; k < N; k++){
      const dd = d.map((v, i) => keep[i] ? v : 1 + rnd(6));
      tot += bestCat(dd, p).u + (left > 1 && m !== 31 ? 0 : 0);
    }
    const ev = tot / N;
    if(!best || ev > best.ev) best = {keep, ev};
  }
  return best;
}
async function aiTurn(){
  const g = G, p = P(); if(!p.ai || g.rolled || NET()) return;
  const alive = () => G === g && P() === p;
  await roll(); if(!alive()) return;
  while(G.left > 0){
    await sleep(500); if(!alive()) return;
    const h = bestHold(G.dice, p, G.left);
    if(h.keep.every(k => k)) break;
    for(let i = 0; i < 5; i++){
      const want = !!h.keep[i];
      if(G.held[i] !== want){ G.held[i] = want; if(!want) scatter([i]); Snd.keep(); renderDice(); await sleep(220); if(!alive()) return; }
    }
    await sleep(250); if(!alive()) return;
    await roll(); if(!alive()) return;
  }
  await sleep(600); if(!alive()) return;
  choose(bestCat(G.dice, p).id);
}

/* ================= MODES ================= */
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  if(busy || b.dataset.m === mode) return;
  mode = b.dataset.m; start({});
});
$("newg").onclick = () => { if(!busy && !NET()) start({}); };
document.addEventListener("keydown", e => {
  if(e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
  if((e.key === " " || e.key === "Enter") && G && !P().ai){ e.preventDefault(); myRoll(); }
});

/* ================= Conserver la partie lors d'une mise à jour ================= */
function snapshot(){ try{ window.claude?.hot?.snapshot?.(() => JSON.parse(JSON.stringify({G, mode, spots}))); }catch(e){} }
function start(data){
  busy = false;
  if(data && data.G){ G = data.G; mode = data.mode; data.spots.forEach((s, i) => spots[i] = s); }
  else G = newState();
  $("end").hidden = true;
  renderDice(); renderUI(); snapshot();
  if(NET()){ netGen++; Net.cancel(); netStep(); return; }
  if(P().ai && !G.rolled){ const g = G; setTimeout(() => { if(G === g) aiTurn(); }, 800); }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

if(window.Net) Net.setup({
  game: "yams", name: "Yam's", min: 2, max: 4, bots: true, seats: () => 2,
  current: () => G ? G.cur : -1,
  start(){ mode = "net"; start({}); },
  leave(){ netGen++; mode = "ai"; start({}); }
});
})();
</script>
